<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 质检设置</title>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #000; color: #fff; border: none; cursor: pointer; border-radius: 5px; }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <h3>⚙️ 引擎配置</h3>
  <label>API Key (支持千问/OpenAI等格式):</label>
  <input type="password" id="apiKey" placeholder="sk-xxxxxxx">
  <label>API 接口地址:</label>
  <input type="text" id="apiUrl" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions" value="https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions">
  <label>模型名称:</label>
  <input type="text" id="modelName" placeholder="qwen-vl-max" value="qwen-vl-max">
  <button id="saveBtn">保存配置</button>
  <p id="status" style="color: green; display: none; font-size: 12px;">保存成功！</p>
  <script src="popup.js"></script>
</body>
</html>
